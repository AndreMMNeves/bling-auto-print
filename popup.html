<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Onix HOF - Auto Impressão</title>
    <style>
      body {
        font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        width: 260px;
        margin: 0;
        padding: 14px 16px;
        color: #222;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 10px 0;
        color: #0a7c3a;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 8px 0;
        font-size: 13px;
      }
      .status {
        font-weight: 600;
      }
      .on  { color: #0a7c3a; }
      .off { color: #b00020; }
      button {
        background: #0a7c3a;
        color: white;
        border: none;
        padding: 6px 12px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 12px;
      }
      button.off { background: #b00020; }
      .hint {
        font-size: 11px;
        color: #666;
        margin-top: 8px;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <h1>Onix HOF - Auto Impressão Bling</h1>
    <div class="row">
      <span>Status:</span>
      <span id="status" class="status on">Ligado</span>
    </div>
    <div class="row">
      <button id="toggle">Desligar</button>
    </div>
    <p class="hint">
      Quando você marca um pedido como <b>Atendido</b>, a página de
      impressão abre automaticamente e o diálogo de impressão aparece.
    </p>
    <script src="popup.js"></script>
  </body>
</html>
